<section id="sobre-mi" class="relative py-24 bg-slate-950 text-white overflow-hidden">
  <div class="absolute inset-0 z-0 pointer-events-none">
    <div
      class="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:24px_24px] opacity-40">
    </div>
    <div class="absolute top-0 -right-40 w-[40rem] h-[40rem] bg-teal-500 rounded-full filter blur-[150px] opacity-30">
    </div>
    <div
      class="absolute -bottom-40 -left-40 w-[40rem] h-[40rem] bg-emerald-500 rounded-full filter blur-[150px] opacity-30">
    </div>
  </div>

  <div class="max-w-6xl mx-auto px-6 relative z-10">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
      <div>
        <h2 class="text-4xl md:text-5xl font-extrabold mb-6">
          Sobre <span class="text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-emerald-500">mí</span>
        </h2>
        @for (paragraph of bioParagraphs; track paragraph) {
        <p class="text-lg text-slate-400 leading-relaxed mb-6">
          {{ paragraph }}
        </p>
        }
        <a href="#contacto"
          class="inline-flex items-center gap-2 text-teal-400 font-semibold hover:text-teal-300 transition-colors mt-4 group">
          Hablemos de su proyecto
          <svg lucideIcon="arrow-right" class="w-4 h-4 transition-transform group-hover:translate-x-1"></svg>
        </a>
      </div>

      <div
        class="bg-slate-900/60 backdrop-blur-md p-8 md:p-10 rounded-3xl border border-slate-700/50 shadow-2xl shadow-black/50 relative">
        <div class="absolute -top-4 -right-4 w-24 h-24 bg-teal-500 rounded-full filter blur-[40px] opacity-20"></div>

        <h3 class="text-2xl font-bold mb-8 text-white flex items-center gap-3">
          <svg lucideIcon="code" class="w-6 h-6 text-teal-400"></svg>
          Stack Tecnológico
        </h3>

        <div class="space-y-8 relative z-10">
          @for (group of skillGroups; track group.category) {
          <div>
            <h4 class="text-sm font-semibold text-slate-400 uppercase tracking-widest mb-4">{{ group.category }}</h4>
            <div class="flex flex-wrap gap-2.5">
              @for (skill of group.skills; track skill) {
              <span
                class="px-4 py-1.5 bg-slate-800/80 text-slate-200 rounded-lg text-sm border border-slate-700 hover:border-teal-500/50 hover:bg-slate-800 transition-colors cursor-default">
                {{ skill }}
              </span>
              }
            </div>
          </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
