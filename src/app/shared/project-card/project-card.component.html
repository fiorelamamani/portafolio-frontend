<div
  class="group bg-linear-to-b from-cyan-950 via-teal-500/40 to-emerald-500/60 rounded-2xl border border-slate-800 overflow-hidden hover:shadow-[0_0_30px_rgba(20,184,166,0.15)] transition-all duration-300 flex flex-col h-full">
  <div class="h-48 overflow-hidden bg-cyan-950/10 relative">
    <img [src]="project.imageUrl" [alt]="project.title"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
  </div>
  <div class="p-6 flex flex-col flex-grow">
    <h3 class="text-2xl font-bold text-white mb-3">{{ project.title }}</h3>
    <p class="text-white mb-6 flex-grow leading-relaxed text-sm">{{ project.description }}</p>
    <div class="flex flex-wrap gap-2 mb-6">
      @for (tech of project.techStack; track tech) {
      <span class="px-3 py-1 text-xs font-semibold bg-teal-900/60 text-teal-300 rounded-full border border-teal-800/80">
        {{ tech }}
      </span>
      }
    </div>

    <div class="flex items-center justify-end gap-4 mt-auto pt-4 border-t border-slate-800">
      @if (project.demoUrl) {
      <a [href]="project.demoUrl" target="_blank" rel="noopener noreferrer"
        class="flex items-center gap-2 px-4 py-1 rounded-full text-sm font-semibold text-white bg-teal-600 hover:bg-teal-500 transition-colors">
        Ver Demo
        <svg lucideIcon="external-link" class="w-4 h-4"></svg>
      </a>
      }
      @if (project.repoUrl) {
      <a [href]="project.repoUrl" target="_blank" rel="noopener noreferrer"
        class="flex items-center gap-2 px-4 py-1 rounded-full text-sm font-semibold text-slate-300 bg-slate-800 hover:bg-slate-700 hover:text-white border border-slate-700 transition-colors">
        Código
        <svg lucideIcon="code" class="w-4 h-4"></svg>
      </a>
      }

    </div>
  </div>
</div>
